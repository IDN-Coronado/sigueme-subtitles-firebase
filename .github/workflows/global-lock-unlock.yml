name: "Global PR Lock Propagate"

# When a merge lock is applied, removed, or a locked PR closes, other open PRs
# still have a stale enforce-lock check. Re-evaluate and post a fresh check run
# for each of them so the Freeze ruleset sees the current lock state.
on:
  pull_request:
    types: [labeled, unlabeled, closed]

jobs:
  propagate-lock-status:
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'lock-for-merge') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'lock-for-merge') ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'lock-for-merge'))
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Re-evaluate enforce-lock on other open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          LOCK_LABEL="lock-for-merge"

          echo "Lock state changed via '$EVENT_ACTION' on PR #$TRIGGER_PR."
          echo "Re-evaluating enforce-lock on other open PRs..."

          # Prefer labels from each PR payload over `gh pr list --label`, which can
          # lag behind labeled/unlabeled events via GitHub's issue search index.
          LOCKED_PRS=$(gh pr list --state open --json number,labels \
            --jq "[.[] | select(any(.labels[]; .name == \"$LOCK_LABEL\")) | .number][]")

          # Trust this event for the PR that just changed.
          if [ "$EVENT_ACTION" = "unlabeled" ] || [ "$EVENT_ACTION" = "closed" ]; then
            LOCKED_PRS=$(echo "$LOCKED_PRS" | grep -vx "$TRIGGER_PR" || true)
          elif [ "$EVENT_ACTION" = "labeled" ]; then
            if ! echo "$LOCKED_PRS" | grep -Fxq "$TRIGGER_PR"; then
              LOCKED_PRS=$(printf '%s\n%s\n' "$LOCKED_PRS" "$TRIGGER_PR" | sed '/^$/d')
            fi
          fi

          if [ -z "$LOCKED_PRS" ]; then
            echo "No open PRs currently hold '$LOCK_LABEL'."
          else
            echo "Locked PR(s): $(echo "$LOCKED_PRS" | tr '\n' ' ')"
          fi

          # number<TAB>headRefOid for every open PR except the one that triggered this run
          OTHER_PRS=$(gh pr list --state open --json number,headRefOid \
            --jq ".[] | select(.number != ${TRIGGER_PR}) | \"\(.number)\t\(.headRefOid)\"")

          if [ -z "$OTHER_PRS" ]; then
            echo "No other open PRs to update."
            exit 0
          fi

          while IFS=$'\t' read -r PR HEAD_SHA; do
            [ -z "$PR" ] && continue

            if [ -z "$LOCKED_PRS" ]; then
              CONCLUSION="success"
              TITLE="No merge lock"
              SUMMARY="No open PRs hold the \`$LOCK_LABEL\` label. Safe to proceed."
            elif echo "$LOCKED_PRS" | grep -Fxq "$PR"; then
              CONCLUSION="success"
              TITLE="This PR holds the lock"
              SUMMARY="PR #$PR holds the \`$LOCK_LABEL\` label and may merge."
            else
              PR_LIST=$(echo "$LOCKED_PRS" | tr '\n' ',' | sed 's/,$//')
              CONCLUSION="failure"
              TITLE="Merge blocked by lock"
              SUMMARY="Merge blocked. PR(s) #$PR_LIST currently hold the \`$LOCK_LABEL\` label."
            fi

            echo "Updating enforce-lock on PR #$PR (sha ${HEAD_SHA:0:7}) -> $CONCLUSION"

            gh api --method POST "/repos/$GH_REPO/check-runs" \
              -f name='enforce-lock' \
              -f head_sha="$HEAD_SHA" \
              -f status='completed' \
              -f conclusion="$CONCLUSION" \
              -f "output[title]=$TITLE" \
              -f "output[summary]=$SUMMARY"
          done <<< "$OTHER_PRS"

          echo "Finished propagating lock status."
